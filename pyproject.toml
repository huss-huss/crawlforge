[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crawlforge"
version = "0.1.0"
description = "A resilient, observable data extraction framework for async Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hussen Mohammed" }]
requires-python = ">=3.12"
keywords = ["crawler", "scraping", "asyncio", "httpx", "data-extraction", "prometheus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27,<1",
    "parsel>=1.9,<2",
    "pydantic>=2.7,<3",
    "prometheus-client>=0.20,<1",
    "redis>=5.0,<9",
    "asyncpg>=0.29,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "fakeredis>=2.23,<3",
    "ruff>=0.6,<1",
]

[project.scripts]
crawlforge = "crawlforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# ASYNC109: fetchers take an explicit timeout that is forwarded to the transport.
ignore = ["RUF012", "ASYNC109"]
